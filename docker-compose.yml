# Solo intervu.cc Contabo deploy. For both sites use subspace deploy/contabo-web/.
#
#   cp .env.local .env.production
#   docker compose up -d --build

services:
  intervu:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    mem_limit: 1g
    cpus: "1.0"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - intervu

secrets:
  env:
    file: .env.production

volumes:
  caddy_data:
  caddy_config:
