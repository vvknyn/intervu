<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harbourline Health - Registered Nurse - ICU</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;color:#1d2b24;background:#f7f5ef}
.top{background:#20384f;color:#fff;padding:18px 40px;font:600 20px system-ui,sans-serif;letter-spacing:.02em}
.top span{font-weight:400;opacity:.8;margin-left:12px;font-size:15px}
main{max-width:640px;margin:28px 40px}
.posting{font:600 26px Georgia,serif;margin:0 0 4px}
.facts{font-size:15px;color:#4a5a52;margin:0 0 20px}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:#4a5a52;margin:0 0 12px}
.row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px;margin:0 0 12px;font-size:15px}
input,textarea{font:15px system-ui,sans-serif;padding:8px 10px;border:1px solid #c9cfc9;border-radius:6px;background:#fff;color:#1d2b24}
.upload{display:flex;align-items:center;gap:10px}
.attach{font:600 14px system-ui,sans-serif;padding:8px 14px;border:1px solid #20384f;border-radius:6px;background:#fff;color:#20384f}
.hidden-file{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.filename{font-size:14px;color:#1f4d3a}
.submit{margin-top:8px;font:600 15px system-ui,sans-serif;background:#20384f;color:#fff;border:0;border-radius:6px;padding:12px 22px}
</style></head><body>
<div class="top">Harbourline Health <span>Careers</span></div>
<main>
<div class="posting">Registered Nurse - ICU</div>
<p class="facts">Toronto, ON · Critical Care · Full time</p>
<form id="application" novalidate>
<h3>Submit your application</h3>
<label class="row"><span>Resume/CV ✱</span><span class="upload"><button type="button" class="attach">Attach résumé/CV</button><input type="file" name="resume" id="resume-upload-input" class="hidden-file"><span class="filename"></span></span></label>
<label class="row"><span>Full name ✱</span><input name="name"></label>
<label class="row"><span>Email ✱</span><input type="email" name="email"></label>
<label class="row"><span>Phone</span><input name="phone"></label>
<label class="row"><span>Current location</span><input name="location"></label>
<label class="row"><span>Current company</span><input name="org"></label>
<label class="row"><span>LinkedIn URL</span><input name="urls[LinkedIn]"></label>
<label class="row"><span>Additional information</span><textarea name="comments" rows="2"></textarea></label>
<button class="submit" type="submit">Submit application</button>
</form>
</main>
<script>
// Inputs that see a change the way React's own inputs do: only a value set outside the page's own scripts
// (typing, or the extension) and then an input event counts.
const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
window.__changes = [];
for (const input of document.querySelectorAll("form input:not([type=file])")) {
  let tracked = input.value;
  Object.defineProperty(input, "value", { configurable: true, get() { return proto.get.call(this); }, set(v) { tracked = String(v); proto.set.call(this, v); } });
  input.addEventListener("input", () => { const now = proto.get.call(input); if (now !== tracked) { tracked = now; window.__changes.push(input.name); } });
}
document.querySelector("#resume-upload-input").addEventListener("change", (e) => {
  const f = e.target.files[0];
  document.querySelector(".filename").textContent = f ? `${f.name} · ${Math.round(f.size / 1024)} KB` : "";
  window.__changes.push("resume");
});
document.querySelector("form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.querySelector("main").innerHTML = "<div class='posting'>Application submitted!</div><p>Thank you for applying to Harbourline Health. We'll be in touch.</p>";
});
</script>
</body></html>
