<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Signal · Find — filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_system.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0F1216;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card-body { min-width: 0; }
  .card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .age {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--faint);
  }
  .sheet-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sheet-head-row h2 { flex: 1; min-width: 0; }
  .done {
    flex: none;
    font-size: 15px;
    font-weight: 700;
    color: var(--brand);
    padding: 4px 0;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status">
    <span>9:41</span>
    <span class="right">●●● ▮▮</span>
  </div>

  <header class="topbar">
    <div class="wordmark">intervu<span class="beta">beta</span></div>
    <div class="avatar">V</div>
  </header>

  <div class="scroll">
    <div class="pad" style="padding-bottom:0">
      <form class="search-stack" onsubmit="return false">
        <label class="field">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="search" value="Senior software engineer" autocomplete="off">
        </label>
        <label class="field">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.75c-2.4 0-4.35 1.9-4.35 4.25 0 3.2 4.35 8.25 4.35 8.25s4.35-5.05 4.35-8.25C12.35 3.65 10.4 1.75 8 1.75z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <input type="text" value="United States" autocomplete="off">
        </label>
        <button type="submit" class="btn-primary">Search</button>
      </form>

      <div class="chip-row">
        <button type="button" class="chip on">Filters <span style="opacity:.75;font-size:10px">▾</span></button>
        <span class="chip soft">United States</span>
        <span class="chip soft">Remote</span>
      </div>

      <div class="meta-line">
        <span>847 · elite board</span>
        <span>freshest</span>
      </div>
    </div>

    <div class="pad-x" style="padding-bottom:16px">
      <button type="button" class="card selected">
        <div class="logo" style="background:#E6F4EF;color:#0D6E56">B</div>
        <div class="card-body">
          <div class="card-top">
            <p class="title">Senior Platform Engineer</p>
            <span class="age">3d ago</span>
          </div>
          <div class="sub"><span class="co">Buildkite</span><span>Remote · US</span><span class="mono">$180–220k</span></div>
          <div class="live"><span class="dot" aria-hidden="true"></span> Live · no ghost signals</div>
        </div>
      </button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Primary">
    <a class="tab" href="01-find-empty.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
      </svg>
      Find
    </a>
    <a class="tab" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/>
      </svg>
      Tracker
    </a>
    <a class="tab" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>
      </svg>
      Resume
    </a>
    <a class="tab" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/>
      </svg>
      Prep
    </a>
  </nav>

  <div class="sheet-scrim" aria-hidden="false">
    <div class="sheet" role="dialog" aria-label="Filters">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head sheet-head-row">
        <h2>Filters</h2>
        <button type="button" class="done">Done</button>
      </div>
      <div class="sheet-body">
        <div class="filter-group">
          <h4>Work type</h4>
          <button type="button" class="opt" aria-pressed="true"><span class="box">✓</span> Remote <span class="n">412</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Hybrid <span class="n">186</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> On-site <span class="n">249</span></button>
        </div>
        <div class="filter-group">
          <h4>Date posted</h4>
          <button type="button" class="opt" aria-pressed="true"><span class="box">✓</span> Any date</button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Past 24h <span class="n">38</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Past week <span class="n">214</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Past month <span class="n">641</span></button>
        </div>
        <div class="filter-group">
          <h4>Experience</h4>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Senior <span class="n">520</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Staff+ <span class="n">91</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Mid <span class="n">203</span></button>
        </div>
        <div class="filter-group">
          <h4>Salary</h4>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> $150k+</button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> $180k+</button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> $200k+</button>
        </div>
        <div class="filter-group">
          <h4>Ghost risk</h4>
          <button type="button" class="opt" aria-pressed="true"><span class="box">✓</span> Hide likely ghosts</button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> Show all postings</button>
        </div>
        <div class="filter-group">
          <h4>Boards</h4>
          <button type="button" class="opt" aria-pressed="true"><span class="box">✓</span> Elite startups <span class="n">847</span></button>
          <button type="button" class="opt" aria-pressed="false"><span class="box"></span> All companies</button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
