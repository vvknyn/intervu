<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Signal · Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_system.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0F1216;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .phone-body {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .bg-blur {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    filter: blur(5px);
    opacity: .6;
    pointer-events: none;
  }
  .auth-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--gutter);
    background: rgba(15,18,22,.28);
  }
  .auth-card {
    width: 100%;
    max-width: 326px;
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 20px var(--gutter) 16px;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--bg);
    border-radius: var(--r-md);
    margin-bottom: 16px;
  }
  .auth-tab {
    height: 36px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
    display: grid;
    place-items: center;
  }
  .auth-tab.on {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(18,21,26,.08);
  }
  .auth-card label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
  }
  .auth-card .field {
    margin-bottom: 12px;
    height: 44px;
  }
  .auth-card .field input { font-size: 14px; }
  .btn-continue {
    width: 100%;
    height: 44px;
    margin-top: 4px;
    border-radius: var(--r-md);
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    font-size: 11px;
    color: var(--faint);
    font-family: var(--mono);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .btn-google {
    width: 100%;
    height: 44px;
    border-radius: var(--r-md);
    border: 1px solid var(--line-2);
    background: var(--surface);
    font-size: 14px;
    font-weight: 650;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="phone" role="img" aria-label="Auth overlay on Find jobs">
  <div class="status">
    <span>9:41</span>
    <span class="right">●●● ▮▮▮</span>
  </div>
  <header class="topbar">
    <div><span class="wordmark">Intervu</span><span class="beta">Beta</span></div>
    <div class="avatar">V</div>
  </header>
  <div class="phone-body">
    <div class="bg-blur" aria-hidden="true">
      <main class="scroll pad">
        <div class="search-stack">
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input type="text" placeholder="Role, skills, company…" value="Platform engineer" readonly>
          </div>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.2-6-10a6 6 0 1112 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
            <input type="text" placeholder="City or remote" value="Remote · US" readonly>
          </div>
          <button type="button" class="btn-primary">Search</button>
        </div>
        <div class="meta-line"><span>847 roles</span><span>Updated 4m ago</span></div>
        <article class="card" style="margin-top:12px">
          <div class="logo" style="background:#E8F0FE;color:#1A56DB">B</div>
          <div>
            <h3 class="title">Senior Platform Engineer</h3>
            <div class="sub"><span class="co">Buildkite</span><span class="mono">Remote · US</span></div>
            <div class="live"><span class="dot"></span> Live · 2h ago</div>
            <div class="fit">Strong fit · 91%</div>
          </div>
        </article>
        <article class="card">
          <div class="logo" style="background:#F3E8FF;color:#7C3AED">S</div>
          <div>
            <h3 class="title">Staff SRE</h3>
            <div class="sub"><span class="co">Stripe</span><span class="mono">Hybrid · SF</span></div>
            <div class="live"><span class="dot"></span> Live · 5h ago</div>
          </div>
        </article>
      </main>
    </div>
    <div class="auth-overlay">
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab on" aria-selected="true">Log in</button>
          <button type="button" class="auth-tab">Sign up</button>
        </div>
        <label for="email">Email</label>
        <div class="field">
          <input id="email" type="email" placeholder="you@company.com">
        </div>
        <label for="pw">Password</label>
        <div class="field">
          <input id="pw" type="password" placeholder="••••••••">
        </div>
        <button type="button" class="btn-continue">Continue</button>
        <div class="divider">or</div>
        <button type="button" class="btn-google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a class="tab" href="02-find-serp.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      Find
    </a>
    <a class="tab" href="07-tracker.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="14" rx="1"/></svg>
      Tracker
    </a>
    <a class="tab" href="09-resume.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      Resume
    </a>
    <a class="tab" href="10-prep-landing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Prep
    </a>
  </nav>
</div>
</body>
</html>
