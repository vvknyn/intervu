<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Signal · Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_system.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100%; position: relative; }
  .filter-bar-right { display: flex; align-items: center; gap: 16px; flex: none; }
  .card-body { min-width: 0; }
  .intel .sep { color: var(--line-2); }
  .page-under { filter: blur(2px); opacity: .55; pointer-events: none; }
  .scrim { position: fixed; inset: 0; z-index: 40; }
  .btn-continue {
    width: 100%;
    height: 44px;
    margin-top: 4px;
    border-radius: var(--r-md);
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .btn-continue:hover { background: #0a5c47; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    font-size: 11px;
    color: var(--faint);
    font-family: var(--mono);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .btn-google {
    width: 100%;
    height: 44px;
    border-radius: var(--r-md);
    border: 1px solid var(--line-2);
    background: var(--surface);
    font-size: 14px;
    font-weight: 650;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="page-under">
  <div class="lab">
    <div><strong>05 · Auth</strong> · modal over SERP</div>
    <div><a href="02-find-serp.html">← SERP</a></div>
  </div>

  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand-block">
        <div class="wordmark">intervu</div>
        <span class="beta">beta</span>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="01-find-empty.html" aria-current="page">Find jobs</a>
        <a href="#">Tracker</a>
        <a href="#">Resume</a>
        <a href="#">Interview prep</a>
      </nav>
      <div class="topbar-actions">
        <button type="button">night</button>
        <button type="button">Log in</button>
      </div>
    </div>
  </header>

  <section class="search-band">
    <div class="shell">
      <form class="search-row" onsubmit="return false">
        <label class="field">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="search" value="Senior software engineer" readonly>
        </label>
        <label class="field">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.75c-2.4 0-4.35 1.9-4.35 4.25 0 3.2 4.35 8.25 4.35 8.25s4.35-5.05 4.35-8.25C12.35 3.65 10.4 1.75 8 1.75z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <input type="text" value="United States" readonly>
        </label>
        <button class="btn-search" type="submit">Search</button>
      </form>

      <div class="filter-bar">
        <div class="filter-bar-left">
          <button type="button" class="filter-toggle" aria-expanded="false">Filters <span>(1)</span></button>
          <span class="pill">Remote</span>
        </div>
        <div class="filter-bar-right">
          <span class="result-meta">847 roles</span>
        </div>
      </div>
    </div>
  </section>

  <main class="main">
    <div class="shell main-split">
      <section class="list-col" aria-label="Results">
        <div class="list-head">
          <h1>Results <span>847 · elite board</span></h1>
          <div class="sort" role="group" aria-label="Sort">
            <button type="button" aria-pressed="true">freshest</button>
            <button type="button" aria-pressed="false">top pay</button>
            <button type="button" aria-pressed="false">fit</button>
          </div>
        </div>

        <button type="button" class="card" aria-selected="true">
          <div class="logo" style="background:#E6F4EF;color:#0D6E56">B</div>
          <div class="card-body">
            <p class="title">Senior Platform Engineer</p>
            <div class="meta"><span class="co">Buildkite</span><span>Remote · US</span><span class="mono">$180–220k</span></div>
            <div class="live"><span class="dot" aria-hidden="true"></span> Live · no ghost signals</div>
            <span class="fit-link">Am I a fit? →</span>
          </div>
          <div class="card-aside">
            <span class="apply">Apply</span>
            <span class="age">3d ago</span>
          </div>
        </button>

        <button type="button" class="card" aria-selected="false">
          <div class="logo" style="background:#E8EDF6;color:#2B4A7E">C</div>
          <div class="card-body">
            <p class="title">Staff Backend Engineer</p>
            <div class="meta"><span class="co">Console</span><span>SF / Hybrid</span><span class="mono">$200–250k</span></div>
            <div class="live"><span class="dot" aria-hidden="true"></span> Live · no ghost signals</div>
          </div>
          <div class="card-aside">
            <span class="apply">Apply</span>
            <span class="age">1d ago</span>
          </div>
        </button>
      </section>

      <aside class="detail" aria-label="Job detail">
        <div class="detail-head">
          <h2>Senior Platform Engineer</h2>
          <div class="detail-sub">Buildkite · Remote · US · $180–220k</div>
        </div>
        <div class="detail-actions">
          <button type="button" class="act primary">✓ Go after this job</button>
          <button type="button" class="act brand">✦ Tailored resume</button>
          <button type="button" class="act">↗ Open posting</button>
          <button type="button" class="act">Mark as applied</button>
        </div>
        <div class="detail-scroll">
          <div class="banner">
            <span class="dot" aria-hidden="true"></span>
            <div>
              <strong>Live · no ghost signals</strong>
              <span>No repost loop or 45+ day staleness on this listing.</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="scrim" role="dialog" aria-modal="true" aria-label="Log in">
  <div class="modal">
    <div class="tabs" role="tablist">
      <button type="button" aria-selected="true">Log in</button>
      <button type="button" aria-selected="false">Sign up</button>
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com">
    </div>
    <div class="form-field">
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="••••••••">
    </div>
    <button type="button" class="btn-continue">Continue</button>

    <div class="divider">or</div>

    <button type="button" class="btn-google">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>
  </div>
</div>

</body>
</html>
