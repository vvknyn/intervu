<style>
  .settings-group { margin-bottom: 20px; }
  .settings-group h3 {
    margin: 0 0 8px; font-family: var(--mono);
    font-size: 10px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
  }
  .settings-list { padding: 4px 0; }
  .settings-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 48px; padding: 8px 0;
    border-bottom: 1px solid var(--line); text-align: left;
    font-size: 14px; font-weight: 650;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:hover { color: var(--brand); }
  .settings-row .ico {
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    background: var(--bg); border-radius: var(--r-sm);
    color: var(--muted);
  }
  .settings-row .ico svg { width: 16px; height: 16px; }
  .settings-row .meta {
    margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .settings-row .chev { flex: none; color: var(--faint); }
  .settings-row .chev svg { width: 16px; height: 16px; display: block; }
</style>
