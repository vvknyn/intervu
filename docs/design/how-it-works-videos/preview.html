<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How it works — video preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12151a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2a2f36;
      --iris: #7cb87a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }
    p.lead {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    p.lead strong {
      color: var(--iris);
      font-weight: 600;
    }
    .grid {
      display: grid;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    figure {
      margin: 0;
    }
    figcaption {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    figcaption span {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    .beats {
      list-style: none;
      padding: 0;
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .beats li::before {
      content: "→ ";
      color: var(--iris);
    }
    video {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <h1>How it works — loop preview</h1>
  <p class="lead"><strong>Silent explainer · no audio needed.</strong> UI-forward beats with step badges + captions burned in. ~15s each, muted loop. ~60% of runtime is post-setup usage.</p>

  <div class="grid">
    <figure>
      <figcaption>
        Claude MCP
        <span>Title → connect → approve → ask → verified roles → you stay in control</span>
      </figcaption>
      <ul class="beats">
        <li>0.0–2.5s · Title — Connect Claude to the job market</li>
        <li>2.5–4.5s · Setup — Add connector (paste MCP URL)</li>
        <li>4.5–6.5s · Setup — Approve once</li>
        <li>6.5–10.5s · Use — Ask in chat</li>
        <li>10.5–14.5s · Use — Real jobs · save to tracker</li>
        <li>14.5–17.5s · Payoff — You stay in control</li>
      </ul>
      <video
        src="video-a-mcp-loop.mp4"
        poster="poster-a-mcp.png"
        autoplay
        loop
        muted
        playsinline
        controls
      ></video>
    </figure>

    <figure>
      <figcaption>
        OpenClaw
        <span>Title → install → approve → overnight agent → WhatsApp digest → you click submit</span>
      </figcaption>
      <ul class="beats">
        <li>0.0–2.5s · Title — Overnight prep on your machine</li>
        <li>2.5–4.5s · Setup — One command install</li>
        <li>4.5–6.5s · Setup — Approve in browser</li>
        <li>6.5–10.0s · Use — Agent works overnight</li>
        <li>10.0–14.5s · Use — Wake up to drafts</li>
        <li>14.5–17.0s · Payoff — You always click submit</li>
      </ul>
      <video
        src="video-b-openclaw-loop.mp4"
        poster="poster-b-openclaw.png"
        autoplay
        loop
        muted
        playsinline
        controls
      ></video>
    </figure>
  </div>
</body>
</html>
